<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a1a2e" />
  <link rel="manifest" href="manifest.json" />
  <title>本地 LLM 聊天</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    #header {
      padding: 0.75rem 1rem;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
    }
    h1 { font-size: 1.1rem; margin-bottom: 0.25rem; }
    #status { font-size: 0.8rem; color: #888; }
    #progress-wrap { margin-top: 0.4rem; height: 4px; background: #0f3460; border-radius: 2px; display: none; }
    #progress-bar { height: 100%; background: #4a90e2; border-radius: 2px; width: 0%; transition: width 0.2s; }
    #load-btn {
      margin-top: 0.5rem;
      padding: 0.4rem 1rem;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    #load-btn:disabled { background: #333; cursor: not-allowed; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .msg {
      max-width: 85%;
      padding: 0.6rem 0.9rem;
      border-radius: 12px;
      font-size: 0.93rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user { background: #4a90e2; align-self: flex-end; }
    .assistant { background: #16213e; border: 1px solid #0f3460; align-self: flex-start; }
    #bottom {
      padding: 0.75rem;
      background: #16213e;
      border-top: 1px solid #0f3460;
      display: flex;
      gap: 0.5rem;
      flex-shrink: 0;
    }
    #input {
      flex: 1;
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      border: 1px solid #0f3460;
      background: #0d1b2a;
      color: #eee;
      font-size: 0.93rem;
      resize: none;
      font-family: inherit;
    }
    #input:disabled { opacity: 0.4; }
    #send-btn {
      padding: 0.6rem 1rem;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      align-self: flex-end;
    }
    #send-btn:disabled { background: #333; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="header">
    <h1>本地 LLM 聊天</h1>
    <div id="status">尚未載入模型</div>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <button id="load-btn">載入模型</button>
  </div>

  <div id="messages"></div>

  <div id="bottom">
    <textarea id="input" rows="2" placeholder="輸入訊息… (Enter 送出，Shift+Enter 換行)" disabled></textarea>
    <button id="send-btn" disabled>送出</button>
  </div>

  <script type="module">
    import { Wllama } from 'https://cdn.jsdelivr.net/npm/@wllama/wllama@3.2.3/esm/index.js';

    // 測試用的小模型（260 KB），確認流程後可換成正式模型
    const MODEL = {
      repo: 'ggml-org/models',
      file: 'tinyllamas/stories260K.gguf',
    };

    const wllama = new Wllama({
      default: 'https://cdn.jsdelivr.net/npm/@wllama/wllama@3.2.3/esm/wasm/wllama.wasm',
    });

    let generating = false;
    const history = [];

    const statusEl  = document.getElementById('status');
    const progressW = document.getElementById('progress-wrap');
    const progressB = document.getElementById('progress-bar');
    const messagesEl = document.getElementById('messages');
    const inputEl   = document.getElementById('input');
    const sendBtn   = document.getElementById('send-btn');
    const loadBtn   = document.getElementById('load-btn');

    function setStatus(t) { statusEl.textContent = t; }

    function appendMsg(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    loadBtn.addEventListener('click', async () => {
      loadBtn.disabled = true;
      progressW.style.display = 'block';
      setStatus('正在下載模型…');
      try {
        await wllama.loadModelFromHF(MODEL, {
          progressCallback: ({ loaded, total }) => {
            const pct = total ? Math.round(loaded / total * 100) : 0;
            progressB.style.width = pct + '%';
            setStatus(`下載中… ${pct}%`);
          },
        });
        progressW.style.display = 'none';
        setStatus('模型已載入，可以開始聊天');
        loadBtn.style.display = 'none';
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
      } catch (e) {
        setStatus('載入失敗：' + e.message);
        console.error(e);
        loadBtn.disabled = false;
      }
    });

    async function send() {
      const text = inputEl.value.trim();
      if (!text || generating) return;

      inputEl.value = '';
      inputEl.disabled = true;
      sendBtn.disabled = true;
      generating = true;

      history.push({ role: 'user', content: text });
      appendMsg('user', text);

      const botDiv = appendMsg('assistant', '▋');
      let reply = '';

      try {
        await wllama.createChatCompletion({
          messages: history,
          max_tokens: 512,
          temperature: 0.7,
          stream: true,
          onData: (chunk) => {
            const delta = chunk.choices[0]?.delta?.content ?? '';
            if (delta) {
              reply += delta;
              botDiv.textContent = reply + '▋';
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
          },
        });
      } catch (e) {
        reply = '錯誤：' + e.message;
        console.error(e);
      }

      botDiv.textContent = reply || '（無回應）';
      history.push({ role: 'assistant', content: reply });

      generating = false;
      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }

    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
  </script>
</body>
</html>
